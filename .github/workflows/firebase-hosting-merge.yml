name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - production

  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CURTISFRIESENWEBSITE }}
          channelId: live
          projectId: curtisfriesenwebsite